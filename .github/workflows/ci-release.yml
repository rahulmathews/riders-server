name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      approve_release:
        description: 'Approve this release?'
        required: true
        default: false
        type: boolean

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.15.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint:check

      - name: Run formatting check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test --if-present

  release-approval:
    name: Release Approval
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch'
    outputs:
      approved: ${{ steps.approval.outputs.approved }}
    steps:
      - name: Check Approval Input
        id: approval
        run: |
          if [ "${{ github.event.inputs.approve_release }}" = "true" ]; then
            echo "approved=true" >> $GITHUB_OUTPUT
            echo "✅ Release approved - proceeding with deployment"
          else
            echo "approved=false" >> $GITHUB_OUTPUT
            echo "⏳ Release waiting for approval..."
            echo "📋 To approve: Go to Actions tab and run workflow with approve_release=true"
            echo "❌ Workflow will stop here until approved"
          fi

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, release-approval]
    if: needs.release-approval.outputs.approved == 'true'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Release Execution
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ github.ref_name }}';
            console.log(`🚀 Release approved and executing for ${branch} branch`);
            console.log('✅ Starting semantic-release process...');

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.15.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Make scripts executable
        run: chmod +x .husky/* scripts/*.sh

      - name: Build
        run: npm run build

      - name: Create distribution archive
        run: |
          cd dist
          tar -czf ../riders-server-dist.tar.gz .
          cd ..

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          HUSKY: 0
        run: npx semantic-release
